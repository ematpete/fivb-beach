name: VIS-Daten aktualisieren

on:
  schedule:
    - cron: "17 * * * *"      # stündlich (GitHub kann ein paar Minuten verzögern)
  workflow_dispatch:           # + Button "Run workflow" im Actions-Tab

permissions:
  contents: write

concurrency:
  group: vis-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: data.json erzeugen
        run: python generate.py

      - name: Änderungen committen
        run: |
          git config user.name  "vis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --quiet --cached; then
            echo "Keine Änderungen."
          else
            git commit -m "data: Stand $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
